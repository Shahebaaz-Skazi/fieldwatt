name: Fast Import Upload 03.10.2026

on:
  workflow_dispatch:
    inputs:
      excel_file:
        description: 'Excel file path in repository'
        required: true
        default: 'meter_images/Upload reading 03.10.2026.xlsx'
  push:
    paths:
      - 'meter_images/Upload reading 03.10.2026.xlsx'
      - '.github/workflows/import-03oct.yml'

jobs:
  import-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Import Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node backend/scripts/run_import.js "meter_images/Upload reading 03.10.2026.xlsx" 2>&1 | tee import.log

      - name: Upload Import Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-logs-03oct
          path: import.log
