
name: Fast Import Ajmera Images

on:
  workflow_dispatch:
    inputs:
      excel_file:
        description: "Excel file path in repository"
        required: true
        default: "meter_images/ajmera_15_09_2026.xlsx"
  push:
    paths:
      - "meter_images/ajmera_15_09_2026.xlsx"
      - ".github/workflows/import-ajmera.yml"
      - "backend/scripts/fast_import_ajmera.py"

jobs:
  import-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Fonts & Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install pillow requests openpyxl boto3 python-dotenv

      - name: Run Ultra-Fast Import
        run: |
          set -euo pipefail
          python -u backend/scripts/fast_import_ajmera.py "meter_images/ajmera_15_09_2026.xlsx" 2>&1 | tee import.log

      - name: Upload Import Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-logs-ajmera
          path: import.log

