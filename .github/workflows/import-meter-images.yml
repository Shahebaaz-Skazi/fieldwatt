name: Fast Import Meter Images

on:
  workflow_dispatch:
    inputs:
      excel_file:
        description: 'Excel file path in repository'
        required: true
        default: 'meter_images/kothrud images.xlsx'
  push:
    paths:
      - 'meter_images/kothrud images.xlsx'
      - '.github/workflows/import-meter-images.yml'
      - 'backend/scripts/fast_import_kothrud.py'

jobs:
  import-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow requests openpyxl boto3 python-dotenv

      - name: Run Ultra-Fast Import
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          EXCEL_FILE="${{ github.event.inputs.excel_file }}"
          if [ -z "$EXCEL_FILE" ]; then
            EXCEL_FILE="meter_images/kothrud images.xlsx"
          fi
          echo "Processing file: $EXCEL_FILE"
          python backend/scripts/fast_import_kothrud.py "$EXCEL_FILE"
