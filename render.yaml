services:
  - type: web
    name: fieldwatt-backend
    env: node
    plan: free # ponytail: run on Render free tier
    buildCommand: npm install
    startCommand: npm start
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: JWT_SECRET
        sync: false # Set in Render Dashboard
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false # Cloudflare Account ID
      - key: CLOUDFLARE_D1_DATABASE_ID
        sync: false # Cloudflare D1 Database ID (UUID format)
      - key: CLOUDFLARE_API_TOKEN
        sync: false # Cloudflare API Token
      - key: R2_ACCESS_KEY_ID
        sync: false # R2 S3-compatible Access Key ID
      - key: R2_SECRET_ACCESS_KEY
        sync: false # R2 S3-compatible Secret Access Key
      - key: R2_BUCKET_NAME
        value: fieldwatt-meter-photos
      - key: R2_PUBLIC_BASE_URL
        value: https://pub-3de6f3ace1d04d558c47c0e7df5f333d.r2.dev
      - key: REDIS_URL
        sync: false # Upstash Redis URL (for BullMQ workers)
